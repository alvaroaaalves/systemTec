<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>systemTec - Área do Cliente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><span class="navbar-brand fw-bold">systemTec | Área do Cliente</span><button class="btn btn-outline-light btn-sm" onclick="fazerLogout()">Sair</button></div></nav>
<main class="container my-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h3 class="mb-1">Meus chamados</h3><p class="text-muted mb-0" id="clientePortalNome">Carregando cliente...</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoChamadoCliente">Abrir novo chamado</button></div><div class="card shadow-sm"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Título</th><th>Filial</th><th>Status</th><th>Criado em</th><th></th></tr></thead><tbody id="tabelaChamadosCliente"><tr><td colspan="6" class="text-muted text-center">Carregando...</td></tr></tbody></table></div></div></div></main>
<div class="modal fade" id="modalNovoChamadoCliente" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Abrir novo chamado</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form id="formNovoChamadoCliente"><div class="modal-body"><div class="mb-3"><label class="form-label">Título do problema</label><input id="cliente_chamado_titulo" class="form-control" required></div><div class="mb-3"><label class="form-label">Filial</label><input id="cliente_chamado_filial" class="form-control"></div><div class="mb-3"><label class="form-label">Descrição</label><textarea id="cliente_chamado_descricao" class="form-control" rows="4" required></textarea></div></div><div class="modal-footer"><button type="submit" class="btn btn-primary">Enviar chamado</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script></body></html>
