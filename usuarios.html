<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="dashboard.html">systemTec</a><div class="collapse navbar-collapse show"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="chamados.html">Chamados</a></li><li class="nav-item"><a class="nav-link active" href="usuarios.html">Usuários</a></li><li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li><li class="nav-item"><a class="nav-link" href="notificacoes.html">Notificações</a></li><li class="nav-item"><a class="nav-link" href="configuracoes.html">Configurações</a></li></ul><button class="btn btn-outline-light btn-sm" onclick="fazerLogout()">Sair</button></div></div></nav>
<main class="container my-4"><div class="row g-4"><div class="col-lg-5"><div class="card shadow-sm"><div class="card-header bg-primary text-white"><h5 class="mb-0">Convidar novo usuário</h5></div><div class="card-body"><form id="formUsuario"><div class="mb-3"><label class="form-label">Nome</label><input id="usuario_nome" class="form-control" required></div><div class="mb-3"><label class="form-label">E-mail</label><input id="usuario_email" type="email" class="form-control" required></div><div class="mb-3"><label class="form-label">Perfil</label><select id="usuario_perfil" class="form-select"><option value="atendente">Atendente</option><option value="tecnico">Técnico</option><option value="administrador">Administrador</option></select></div><button class="btn btn-primary w-100" type="submit">Enviar convite por e-mail</button></form><p class="text-muted small mt-3 mb-0">O usuário receberá um link para definir a própria senha. Nenhuma senha é armazenada nesta tela.</p></div></div></div><div class="col-lg-7"><div class="card shadow-sm"><div class="card-header bg-white"><h5 class="mb-0">Usuários cadastrados</h5></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th></tr></thead><tbody id="tabelaUsuariosBody"><tr><td colspan="4" class="text-muted text-center">Carregando...</td></tr></tbody></table></div></div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script>
