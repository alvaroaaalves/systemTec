<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>systemTec - Gestão de Serviços Técnicos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Garante que a tela de login ocupe a altura inteira da tela com elegância */
        #login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: background-color;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-light">

    <!-- 1. TELA DE LOGIN (Visível por padrão) -->
    <div id="login-container" class="container-fluid">
        <div class="row w-100 justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-primary">systemTec</h3>
                        <form id="formLogin">
                            <div class="mb-3">
                                <label for="login_email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="login_email" required>
                            </div>
                            <div class="mb-3">
                                <label for="login_senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="login_senha" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. PAINEL PRINCIPAL / APP (Oculto até o login ser realizado) -->
    <div id="app-container" style="display: none;">
        <!-- Barra de Navegação Superior -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">systemTec Painel</a>
                <button class="btn btn-outline-light btn-sm" onclick="fazerLogout()">Sair (Logout)</button>
            </div>
        </nav>

        <div class="container pb-5">
            <div class="row g-4">
                
                <!-- Coluna Esquerda: Cadastros -->
                <div class="col-lg-6">
                    <!-- Cadastro de Técnico -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">Cadastrar Técnico</div>
                        <div class="card-body">
                            <form id="formTecnico">
                                <div class="mb-2"><input type="text" class="form-control" id="tec_nome" placeholder="Nome Completo" required></div>
                                <div class="row g-2 mb-2">
                                    <div class="col-md-6"><input type="text" class="form-control" id="tec_cpf" placeholder="CPF"></div>
                                    <div class="col-md-6"><input type="text" class="form-control" id="tec_cnpj" placeholder="CNPJ (Opcional)"></div>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-md-4"><input type="text" class="form-control" id="tec_estado" placeholder="Estado (UF)" required></div>
                                    <div class="col-md-8"><input type="text" class="form-control" id="tec_cidade" placeholder="Cidade" required></div>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-md-6"><input type="text" class="form-control" id="tec_bairro" placeholder="Bairro" required></div>
                                    <div class="col-md-6"><input type="text" class="form-control" id="tec_rua" placeholder="Rua e Número" required></div>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-md-6"><input type="text" class="form-control" id="tec_contato" placeholder="Contato (WhatsApp/Tel)" required></div>
                                    <div class="col-md-6"><input type="email" class="form-control" id="tec_email" placeholder="E-mail" required></div>
                                </div>
                                <div class="mb-2"><input type="text" class="form-control" id="tec_ferramentas" placeholder="Ferramentas (separadas por vírgula)"></div>
                                <div class="mb-3"><textarea class="form-control" id="tec_obs" placeholder="Observações do Técnico"></textarea></div>
                                <button type="submit" class="btn btn-success w-100">Salvar Técnico</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Coluna Direita: Chamados e Relatórios -->
                <div class="col-lg-6">
                    <!-- Criar Chamado -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">Criar Chamado</div>
                        <div class="card-body">
                            <form id="formChamado">
                                <div class="mb-2"><input type="text" class="form-control" id="chamado_titulo" placeholder="Título do Chamado" required></div>
                                <div class="row g-2 mb-2">
                                    <div class="col-md-4"><input type="text" class="form-control" id="chamado_estado" placeholder="Estado (UF)" required></div>
                                    <div class="col-md-8"><input type="text" class="form-control" id="chamado_cidade" placeholder="Cidade" required></div>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-md-6"><input type="text" class="form-control" id="chamado_bairro" placeholder="Bairro" required></div>
                                    <div class="col-md-6"><input type="text" class="form-control" id="chamado_rua" placeholder="Rua e Número" required></div>
                                </div>
                                
                                <button type="button" class="btn btn-info btn-sm w-100 mb-2 text-white" onclick="buscarTecnicoMaisProximo()">🔍 Encontrar Técnico Mais Próximo</button>

                                <div class="mb-3">
                                    <label class="form-label small text-muted">Técnico Alocado:</label>
                                    <select class="form-select" id="chamado_tecnico">
                                        <option value="">Selecione um técnico</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Abrir Chamado</button>
                            </form>
                        </div>
                    </div>

                    <!-- Relatório CSV -->
                    <div class="card shadow-sm">
                        <div class="card-header bg-secondary text-white">Relatório de Chamados (CSV)</div>
                        <div class="card-body">
                            <div class="row g-2 mb-2">
                                <div class="col-md-6">
                                    <label class="form-label small">Início:</label>
                                    <input type="date" class="form-control" id="rel_data_inicio">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small">Fim:</label>
                                    <input type="date" class="form-control" id="rel_data_fim">
                                </div>
                            </div>
                            <button type="button" class="btn btn-dark w-100" onclick="gerarRelatorioCSV()">Baixar Relatório CSV</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- SDK do Supabase (Obrigatório vir antes do script.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Seu arquivo de script principal -->
    <script src="script.js"></script>
</body>
</html>
