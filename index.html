<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>systemTec - Login</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Arquivo de estilo personalizado -->
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 400px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">systemTec</h3>
                    <p class="text-muted small">Faça login para acessar o painel</p>
                </div>

                <form id="formLogin">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">E-mail</label>
                        <input type="email" class="form-control" id="login_email" placeholder="seu@email.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Senha</label>
                        <input type="password" class="form-control" id="login_senha" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Entrar no Sistema</button>
                    <div class="text-center mt-3">
                        <a href="recuperar-senha.html" class="small">Esqueci minha senha</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Script principal unificado -->
    <script src="script.js"></script>
</body>
</html>
