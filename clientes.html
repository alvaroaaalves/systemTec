<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ALTH TecSolutions - Clientes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="dashboard.html">ALTH TecSolutions</a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" href="dashboard.html">Dashboard</a><a class="btn btn-outline-light btn-sm" href="chamados.html">Chamados</a><a class="btn btn-outline-light btn-sm" href="tecnicos.html">Técnicos</a><a class="btn btn-outline-light btn-sm" href="usuarios.html">Usuários</a><button class="btn btn-outline-danger btn-sm" onclick="fazerLogout()">Sair</button></div></div></nav>
<main class="container my-4">
    <div class="mb-4"><p class="text-uppercase text-primary small fw-bold mb-1">Cadastros</p><h2 class="mb-1">Clientes</h2><p class="text-muted mb-0">Cadastre a empresa e o e-mail que será usado para acessar o portal.</p></div>
    <div class="card border-0 shadow-sm mb-4"><div class="card-header bg-white"><h5 class="mb-0" id="formClienteTitulo">Adicionar cliente</h5></div><div class="card-body"><form id="formCliente"><input type="hidden" id="cli_id"><div class="row g-2 align-items-end"><div class="col-lg-3"><label class="form-label small fw-semibold">Nome / Empresa *</label><input type="text" id="cli_nome" class="form-control" required></div><div class="col-lg-2"><label class="form-label small fw-semibold">CNPJ / CPF</label><input type="text" id="cli_documento" class="form-control"></div><div class="col-lg-2"><label class="form-label small fw-semibold">Contato</label><input type="text" id="cli_contato" class="form-control"></div><div class="col-lg-3"><label class="form-label small fw-semibold">E-mail de acesso ao portal</label><input type="email" id="cli_email" class="form-control" placeholder="cliente@empresa.com"><div class="form-text">Será usado para login e convite.</div></div><div class="col-lg-2 d-flex gap-2"><button type="submit" class="btn btn-primary flex-grow-1" id="btnSalvarCliente">Salvar</button><button type="button" class="btn btn-outline-secondary" id="btnCancelarCliente" style="display:none" onclick="cancelarEdicaoCliente()">Cancelar</button></div></div></form></div></div>
    <div class="card border-0 shadow-sm"><div class="card-header bg-white d-flex justify-content-between"><h5 class="mb-0">Clientes cadastrados</h5><small class="text-muted">Edite para atualizar os dados de acesso</small></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Cliente</th><th>Documento</th><th>Contato</th><th>Acesso</th><th class="text-end">Ações</th></tr></thead><tbody id="tabelaClientesBody"></tbody></table></div></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script></body></html>
