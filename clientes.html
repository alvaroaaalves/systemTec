<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>systemTec - Gestão de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">systemTec</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="chamados.html">Chamados</a></li>
                    <li class="nav-item"><a class="nav-link" href="tecnicos.html">Técnicos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="relatorios.html">Relatórios</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" onclick="fazerLogout()">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <!-- Formulário de Cadastro -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0" id="formClienteTitulo">Cadastrar Novo Cliente</h5>
                    </div>
                    <div class="card-body">
                        <form id="formCliente">
                            <input type="hidden" id="cli_id">
                            <div class="mb-3">
                                <label class="form-label">Nome do Cliente / Empresa *</label>
                                <input type="text" id="cli_nome" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CNPJ / CPF</label>
                                <input type="text" id="cli_documento" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contato / Telefone</label>
                                <input type="text" id="cli_contato" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" id="cli_email" class="form-control">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary w-100" id="btnSalvarCliente">Salvar Cliente</button>
                                <button type="button" class="btn btn-secondary" id="btnCancelarCliente" style="display:none;" onclick="cancelarEdicaoCliente()">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabela de Clientes -->
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">Clientes Cadastrados</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nome</th>
                                        <th>Documento</th>
                                        <th>Contato</th>
                                        <th class="text-end">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaClientesBody">
                                    <!-- Preenchido via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
