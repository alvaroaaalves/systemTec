<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>systemTec - Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">systemTec Painel</a>
            <div>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">🏠 Home (Dashboard)</a>
                <button class="btn btn-outline-danger btn-sm" onclick="fazerLogout()">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            <!-- Criar Chamado -->
            <div class="col-lg-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">Criar Chamado</div>
                    <div class="card-body">
                        <form id="formChamado">
                            <div class="mb-2"><input type="text" class="form-control" id="chamado_titulo" placeholder="Título do Chamado" required></div>
                            <div class="mb-2"><textarea class="form-control" id="chamado_problema" placeholder="Descrição do Problema" rows="2" required></textarea></div>
                            <div class="row g-2 mb-2">
                                <div class="col-md-4"><input type="text" class="form-control" id="chamado_estado" placeholder="Estado (UF)" required></div>
                                <div class="col-md-8"><input type="text" class="form-control" id="chamado_cidade" placeholder="Cidade" required></div>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="col-md-6"><input type="text" class="form-control" id="chamado_bairro" placeholder="Bairro" required></div>
                                <div class="col-md-6"><input type="text" class="form-control" id="chamado_rua" placeholder="Rua e Número" required></div>
                            </div>
                            
                            <button type="button" class="btn btn-info btn-sm w-100 mb-2 text-white" onclick="buscarTecnicoMaisProximo()">🔍 Encontrar Técnico Mais Próximo via Mapa</button>

                            <div class="mb-3">
                                <label class="form-label small text-muted">Técnico Alocado:</label>
                                <select class="form-select" id="chamado_tecnico">
                                    <option value="">Selecione um técnico</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Abrir Chamado</button>
                        </form>
                    </div>
                </div>

                <!-- Relatório CSV -->
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">Relatório de Chamados (CSV)</div>
                    <div class="card-body">
                        <div class="row g-2 mb-2">
                            <div class="col-md-6"><label class="form-label small">Início:</label><input type="date" class="form-control" id="rel_data_inicio"></div>
                            <div class="col-md-6"><label class="form-label small">Fim:</label><input type="date" class="form-control" id="rel_data_fim"></div>
                        </div>
                        <button type="button" class="btn btn-dark w-100" onclick="gerarRelatorioCSV()">Baixar Relatório CSV</button>
                    </div>
                </div>
            </div>

            <!-- Histórico de Chamados Recentes -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">Chamados Recentes</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th>ID / Título</th>
                                        <th>Status</th>
                                        <th>Cidade</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaChamadosBody">
                                    <!-- Preenchido via JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
