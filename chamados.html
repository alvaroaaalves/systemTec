<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>systemTec - Gestão de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">systemTec Painel</a>
            <div>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="tecnicos.html" class="btn btn-outline-light btn-sm me-2">Técnicos</a>
                <a href="relatorios.html" class="btn btn-outline-light btn-sm me-2">Relatórios</a>
                <button class="btn btn-outline-danger btn-sm" onclick="fazerLogout()">Sair</button>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-3 py-3">
                <div>
                    <p class="text-uppercase text-primary small fw-bold mb-1">Atendimentos</p>
                    <h4 class="mb-0">Chamados registrados</h4>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <input type="search" id="buscaChamados" class="form-control form-control-sm" placeholder="Pesquisar ID, cliente, filial, título ou endereço" oninput="pesquisarChamados()" style="min-width:260px;">
                    <select id="filtroStatus" class="form-select form-select-sm" onchange="carregarChamadosRecentes()" style="min-width:170px;">
                        <option value="">Todos os status</option>
                        <option value="Criado">Criado</option>
                        <option value="Em Atendimento">Em Atendimento</option>
                        <option value="Resolvido">Resolvido</option>
                        <option value="Validado">Validado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                    <button type="button" class="btn btn-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#modalNovoChamadoAdmin">+ Abrir chamado</button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light"><tr><th>ID / Cliente & Filial</th><th>Status</th><th>Prioridade / Prazo</th><th>Cidade</th></tr></thead>
                        <tbody id="tabelaChamadosBody"><tr><td colspan="4" class="text-muted text-center py-4">Carregando...</td></tr></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-3"><small id="paginacaoInfo" class="text-muted"></small><div class="btn-group btn-group-sm"><button type="button" id="paginaAnterior" class="btn btn-outline-secondary" onclick="mudarPaginaChamados(-1)">Anterior</button><button type="button" id="paginaProxima" class="btn btn-outline-secondary" onclick="mudarPaginaChamados(1)">Próxima</button></div></div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalNovoChamadoAdmin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
            <div class="modal-header"><div><h5 class="modal-title">Abrir novo chamado</h5><small class="text-muted">Selecione o cliente e a filial do atendimento</small></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="formChamado"><div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label fw-semibold" for="chamado_cliente">Cliente / Empresa</label><select class="form-select" id="chamado_cliente" required><option value="">Carregando clientes...</option></select></div>
                    <div class="col-md-6"><label class="form-label fw-semibold" for="chamado_filial">Filial / Unidade</label><select class="form-select" id="chamado_filial" required disabled><option value="">Selecione o cliente primeiro...</option></select><div class="form-text" id="ajudaFilialChamado">As filiais serão carregadas após selecionar o cliente.</div></div>
                    <div class="col-12"><label class="form-label fw-semibold" for="chamado_titulo">Título resumido do problema</label><input type="text" class="form-control" id="chamado_titulo" placeholder="Ex.: Impressora fiscal travada" required></div>
                    <div class="col-12"><label class="form-label fw-semibold" for="chamado_problema">Descrição detalhada do problema</label><textarea class="form-control" id="chamado_problema" rows="4" placeholder="Detalhes do que está ocorrendo..." required></textarea></div>
                    <div class="col-md-6"><label class="form-label fw-semibold" for="chamado_prioridade">Prioridade</label><select class="form-select" id="chamado_prioridade" required><option value="Baixa">Baixa</option><option value="Média" selected>Média</option><option value="Alta">Alta</option></select></div>
                    <div class="col-md-6"><label class="form-label fw-semibold" for="chamado_prazo">Prazo</label><input type="datetime-local" class="form-control" id="chamado_prazo"></div>
                </div>
                <div id="resumoEnderecoChamado" class="alert alert-light border mt-3 mb-0 small" style="display:none;"><strong>Endereço da filial:</strong> <span id="textoEnderecoChamado"></span></div>
                <input type="hidden" id="chamado_rua"><input type="hidden" id="chamado_bairro"><input type="hidden" id="chamado_cidade"><input type="hidden" id="chamado_estado"><input type="hidden" id="chamado_lat"><input type="hidden" id="chamado_lon"><input type="hidden" id="chamado_tecnico">
            </div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary">Abrir chamado</button></div></form>
        </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
