<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>systemTec - Gestão de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">systemTec Painel</a>
            <div>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">📊 Dashboard</a>
                <a href="tecnicos.html" class="btn btn-outline-light btn-sm me-2">👷 Técnicos</a>
                <a href="relatorios.html" class="btn btn-outline-light btn-sm me-2">📈 Relatórios</a>
                <button class="btn btn-outline-danger btn-sm" onclick="fazerLogout()">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            <!-- Formulário de Novo Chamado -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold">Abrir Novo Chamado</div>
                    <div class="card-body">
                        <form id="formChamado">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Cliente / Empresa</label>
                                <select class="form-select" id="chamado_cliente" required>
                                    <option value="">Carregando clientes...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Filial / Unidade</label>
                                <input type="text" class="form-control" id="chamado_filial" placeholder="Ex: Filial Centro ou Matriz" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Título Resumido do Problema</label>
                                <input type="text" class="form-control" id="chamado_titulo" placeholder="Ex: Impressora fiscal travada" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Descrição Detalhada do Problema</label>
                                <textarea class="form-control" id="chamado_problema" rows="2" placeholder="Detalhes do que está ocorrendo..." required></textarea>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-muted">Prioridade</label>
                                    <select class="form-select" id="chamado_prioridade" required>
                                        <option value="Baixa">Baixa</option>
                                        <option value="Média" selected>Média</option>
                                        <option value="Alta">Alta</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-muted">Prazo</label>
                                    <input type="datetime-local" class="form-control" id="chamado_prazo">
                                </div>
                            </div>

                            <div class="mb-3 position-relative">
                                <label class="form-label small fw-bold text-muted">Buscar Endereço (CEP ou Rua)</label>
                                <input type="text" class="form-control" id="chamado_busca_endereco" placeholder="Digite para buscar..." oninput="sugerirEnderecosChamado(this.value)">
                                <div id="sugestoesChamado" class="list-group position-absolute w-100 shadow-sm" style="z-index: 1000;"></div>
                            </div>

                            <input type="hidden" id="chamado_rua">
                            <input type="hidden" id="chamado_bairro">
                            <input type="hidden" id="chamado_cidade">
                            <input type="hidden" id="chamado_estado">
                            <input type="hidden" id="chamado_lat">
                            <input type="hidden" id="chamado_lon">

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Técnico Mais Próximo Sugerido</label>
                                <select class="form-select" id="chamado_tecnico">
                                    <option value="">Selecione um endereço acima primeiro</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-bold">Criar Chamado</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lista de Chamados Recentes com Filtros -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold">Chamados Registrados</h5>
                        <div class="d-flex gap-2 flex-wrap">
                            <input type="search" id="buscaChamados" class="form-control form-control-sm" placeholder="Pesquisar ID, cliente, filial, título ou endereço" oninput="pesquisarChamados()" style="min-width: 240px;">
                            <select id="filtroStatus" class="form-select form-select-sm" onchange="carregarChamadosRecentes()">
                                <option value="">Todos os Status</option>
                                <option value="Criado">Criado</option>
                                <option value="Em Atendimento">Em Atendimento</option>
                                <option value="Resolvido">Resolvido</option>
                                <option value="Validado">Validado</option>
                                <option value="Cancelado">Cancelado</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID / Cliente & Filial</th>
                                        <th>Status</th>
                                        <th>Prioridade / Prazo</th>
                                        <th>Cidade</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaChamadosBody">
                                    <tr><td colspan="4" class="text-muted text-center">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <small id="paginacaoInfo" class="text-muted"></small>
                            <div class="btn-group btn-group-sm">
                                <button type="button" id="paginaAnterior" class="btn btn-outline-secondary" onclick="mudarPaginaChamados(-1)">Anterior</button>
                                <button type="button" id="paginaProxima" class="btn btn-outline-secondary" onclick="mudarPaginaChamados(1)">Próxima</button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
