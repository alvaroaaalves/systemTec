<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>systemTec - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">systemTec Painel</a>
            <button class="btn btn-outline-light btn-sm" onclick="fazerLogout()">Sair (Logout)</button>
        </div>
    </nav>

    <div class="container pb-5">
        <h3 class="mb-4 fw-bold text-secondary">📊 Visão Geral do Sistema</h3>
        
        <div class="row g-4">
            <!-- Card Técnicos (Clica e vai para técnicos) -->
            <div class="col-md-4" style="cursor: pointer;" onclick="window.location.href='tecnicos.html'">
                <div class="card text-white bg-dark shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">👥 Técnicos Cadastrados</h5>
                        <h2 id="dash_total_tecnicos" class="fw-bold mt-3">0</h2>
                        <p class="card-text small text-muted mt-2 text-white-50">Clique para gerenciar técnicos &rarr;</p>
                    </div>
                </div>
            </div>

            <!-- Card Chamados (Clica e vai para chamados) -->
            <div class="col-md-8" style="cursor: pointer;" onclick="window.location.href='chamados.html'">
                <div class="card text-white bg-primary shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">🛠️ Resumo de Chamados</h5>
                        <div class="row mt-3 text-center">
                            <div class="col-3 border-end">
                                <span class="small">Total</span>
                                <h3 id="dash_total_chamados" class="fw-bold mb-0">0</h3>
                            </div>
                            <div class="col-3 border-end">
                                <span class="small">Abertos</span>
                                <h3 id="dash_abertos" class="fw-bold mb-0">0</h3>
                            </div>
                            <div class="col-3 border-end">
                                <span class="small">Em Atend.</span>
                                <h3 id="dash_atendimento" class="fw-bold mb-0">0</h3>
                            </div>
                            <div class="col-3">
                                <span class="small">Fechados</span>
                                <h3 id="dash_fechados" class="fw-bold mb-0">0</h3>
                            </div>
                        </div>
                        <p class="card-text small text-right mt-3 text-white-50 text-end">Clique para abrir chamados & ver histórico &rarr;</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
