<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>systemTec - Cliente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="clientes.html">systemTec | Clientes</a><div><a class="btn btn-outline-light btn-sm me-2" href="clientes.html">Voltar</a><button class="btn btn-outline-light btn-sm" onclick="fazerLogout()">Sair</button></div></div></nav>
<main class="container my-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h2 id="tituloCliente">Cadastro do Cliente</h2><p id="subtituloCliente" class="text-muted mb-0">Carregando...</p></div><span id="statusCliente" class="badge bg-secondary">---</span></div>
<div class="row g-4"><div class="col-lg-5"><div class="card shadow-sm"><div class="card-header bg-white"><h5 class="mb-0">Dados gerais</h5></div><div class="card-body"><form id="formClienteDetalhe"><input type="hidden" id="cliente_detalhe_id"><div class="mb-3"><label class="form-label">Nome / Empresa</label><input id="cliente_detalhe_nome" class="form-control" required></div><div class="mb-3"><label class="form-label">CNPJ / CPF</label><input id="cliente_detalhe_documento" class="form-control"></div><div class="mb-3"><label class="form-label">Contato / Telefone</label><input id="cliente_detalhe_contato" class="form-control"></div><div class="mb-3"><label class="form-label">E-mail</label><input id="cliente_detalhe_email" type="email" class="form-control"></div><div class="mb-3"><label class="form-label">SLA individual (horas)</label><input id="cliente_detalhe_sla" type="number" min="1" max="8760" class="form-control" required><div class="form-text">Esse valor será aplicado aos novos chamados.</div></div><div class="mb-3"><label class="form-label">UUID do usuário vinculado</label><input id="cliente_detalhe_usuario_id" class="form-control" placeholder="Opcional"></div><button class="btn btn-primary w-100" type="submit">Salvar dados do cliente</button></form></div></div></div>
<div class="col-lg-7"><div class="card shadow-sm mb-4"><div class="card-header bg-white d-flex justify-content-between align-items-center"><h5 class="mb-0">Filiais e endereços</h5><button class="btn btn-sm btn-success" type="button" onclick="limparFormularioFilial()">Adicionar filial</button></div><div class="card-body"><form id="formFilialCliente" class="border rounded p-3 mb-3"><input type="hidden" id="filial_detalhe_id"><div class="row g-2"><div class="col-md-6"><label class="form-label">Nome da filial</label><input id="filial_detalhe_nome" class="form-control" required></div><div class="col-md-6"><label class="form-label">CEP</label><input id="filial_detalhe_cep" class="form-control"></div><div class="col-md-8 position-relative"><label class="form-label">Rua e número</label><input id="filial_detalhe_rua" class="form-control" required onkeyup="sugerirEnderecoFilialDetalhe(this.value)"><div id="sugestoesFilialDetalhe" class="list-group position-absolute shadow-sm" style="z-index:1050"></div></div><div class="col-md-4"><label class="form-label">Bairro</label><input id="filial_detalhe_bairro" class="form-control"></div><div class="col-md-8"><label class="form-label">Cidade</label><input id="filial_detalhe_cidade" class="form-control"></div><div class="col-md-4"><label class="form-label">Estado</label><input id="filial_detalhe_estado" class="form-control"></div><input type="hidden" id="filial_detalhe_lat"><input type="hidden" id="filial_detalhe_lon"></div><div class="d-flex gap-2 mt-3"><button class="btn btn-success" type="submit">Salvar filial</button><button class="btn btn-outline-secondary" type="button" onclick="limparFormularioFilial()">Cancelar</button></div></form><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Filial</th><th>Endereço</th><th>Status</th><th class="text-end">Ações</th></tr></thead><tbody id="tabelaFiliaisCliente"><tr><td colspan="4" class="text-muted text-center">Carregando...</td></tr></tbody></table></div></div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script></body></html>
