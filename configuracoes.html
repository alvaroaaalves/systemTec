<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>systemTec - Configurações</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="dashboard.html">systemTec | Configurações</a><button class="btn btn-outline-light btn-sm" onclick="fazerLogout()">Sair</button></div></nav>
<main class="container my-4"><div class="row g-4">
<div class="col-lg-5"><div class="card shadow-sm"><div class="card-header bg-primary text-white"><h5 class="mb-0">SLA por cliente</h5></div><div class="card-body"><p class="text-muted small">O valor é informado em horas e será aplicado aos novos chamados desse cliente.</p><form id="formSlaCliente"><div class="mb-3"><label class="form-label" for="config_cliente_id">Cliente</label><select id="config_cliente_id" class="form-select" required><option value="">Carregando...</option></select></div><div class="mb-3"><label class="form-label" for="config_sla_horas">SLA em horas</label><input id="config_sla_horas" type="number" min="1" max="8760" class="form-control" required></div><button class="btn btn-primary w-100" type="submit">Salvar SLA</button></form></div></div></div>
<div class="col-lg-7"><div class="card shadow-sm"><div class="card-header bg-white"><h5 class="mb-0">Tipos de problema</h5></div><div class="card-body"><form id="formProblema" class="row g-2 mb-3"><div class="col"><input id="problema_nome" class="form-control" placeholder="Ex.: Internet, impressora, sistema" required></div><div class="col-auto"><button class="btn btn-success" type="submit">Adicionar</button></div></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Problema</th><th>Status</th><th class="text-end">Ação</th></tr></thead><tbody id="tabelaProblemasBody"><tr><td colspan="3" class="text-muted text-center">Carregando...</td></tr></tbody></table></div></div></div></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script>
</body></html>
