<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>systemTec - Nova senha</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="style.css" rel="stylesheet"></head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light"><main class="container" style="max-width:420px"><div class="card shadow-sm"><div class="card-body p-4"><h3 class="fw-bold text-center">Definir nova senha</h3><p class="text-muted small text-center">Crie uma senha com pelo menos 8 caracteres.</p><form onsubmit="event.preventDefault(); salvarNovaSenha();"><div class="mb-3"><label class="form-label">Nova senha</label><input id="nova_senha" type="password" minlength="8" class="form-control" required></div><div class="mb-3"><label class="form-label">Confirmar senha</label><input id="confirmar_senha" type="password" minlength="8" class="form-control" required></div><button id="btnSalvarNovaSenha" class="btn btn-primary w-100" type="submit">Salvar nova senha</button></form></div></div></main><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script></body></html>
