<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ALTH TecSolutions - Técnicos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="style.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="dashboard.html">ALTH TecSolutions</a><div class="d-flex gap-2"><a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a><a href="chamados.html" class="btn btn-outline-light btn-sm">Chamados</a><a href="clientes.html" class="btn btn-outline-light btn-sm">Clientes</a><a href="usuarios.html" class="btn btn-outline-light btn-sm">Usuários</a><button class="btn btn-outline-danger btn-sm" onclick="fazerLogout()">Sair</button></div></div></nav>
<main class="container my-4"><div class="mb-4"><p class="text-uppercase text-primary small fw-bold mb-1">Cadastros</p><h2 class="mb-1">Técnicos</h2><p class="text-muted mb-0">Cadastre profissionais e mantenha a equipe de atendimento organizada.</p></div>
<div class="card border-0 shadow-sm mb-4"><div class="card-header bg-white"><h5 class="mb-0" id="formTecnicoTitulo">Adicionar técnico</h5></div><div class="card-body"><form id="formTecnico"><input type="hidden" id="tec_id"><div class="row g-2 align-items-end"><div class="col-lg-3"><label class="form-label small fw-semibold">Nome completo *</label><input type="text" class="form-control" id="tec_nome" required></div><div class="col-lg-2"><label class="form-label small fw-semibold">CPF</label><input type="text" class="form-control" id="tec_cpf"></div><div class="col-lg-2"><label class="form-label small fw-semibold">Contato *</label><input type="text" class="form-control" id="tec_contato" required></div><div class="col-lg-3"><label class="form-label small fw-semibold">E-mail *</label><input type="email" class="form-control" id="tec_email" required></div><div class="col-lg-2 d-flex gap-2"><button type="submit" class="btn btn-primary flex-grow-1" id="btnSalvarTecnico">Salvar</button><button type="button" class="btn btn-outline-secondary" id="btnCancelarEdicao" style="display:none" onclick="cancelarEdicao()">Cancelar</button></div></div><div class="row g-2 mt-1"><div class="col-lg-4"><input type="text" class="form-control" id="tec_busca_endereco" placeholder="Endereço do técnico" autocomplete="off" oninput="sugerirEnderecosTecnico(this.value)"><div id="sugestoesTecnico" class="list-group position-absolute shadow-sm" style="z-index:1000"></div></div><div class="col-lg-4"><input type="text" class="form-control" id="tec_ferramentas" placeholder="Ferramentas (separadas por vírgula)"></div><div class="col-lg-4"><input type="text" class="form-control" id="tec_obs" placeholder="Observações"></div></div><input type="hidden" id="tec_rua"><input type="hidden" id="tec_bairro"><input type="hidden" id="tec_cidade"><input type="hidden" id="tec_estado"></form></div></div>
<div class="card border-0 shadow-sm"><div class="card-header bg-white"><h5 class="mb-0">Técnicos cadastrados</h5></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Técnico</th><th>Cidade / Bairro</th><th>Contato</th><th class="text-end">Ações</th></tr></thead><tbody id="tabelaTecnicosBody"></tbody></table></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script></body></html>
